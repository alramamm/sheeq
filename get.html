<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sheeq — أي إطلالة؟ / Which look?</title>
<meta name="description" content="Two looks. People choose. Get Sheeq on the App Store or Google Play." />

<!-- The one link for bios, captions and chats (2026-09-22): each phone is sent
     to its own store. Served as /get from get.html — NOT /get/ — so the link
     answers 200 with no trailing-slash redirect hop, and the query survives.
     ⚠️ The path must never start with "/p": Android's intent filter uses
     pathPrefix "/p", so such a path opens the app for anyone who has it. -->
<meta property="og:type"        content="website" />
<meta property="og:site_name"   content="Sheeq" />
<meta property="og:url"         content="https://sheeq.app/get" />
<meta property="og:title"       content="Sheeq — أي إطلالة؟ · Which look?" />
<meta property="og:description" content="إطلالتين، والناس تختار · Two looks. People choose." />
<meta property="og:image"       content="https://sheeq.app/icon.png" />
<meta name="twitter:card"       content="summary" />
<link rel="canonical"        href="https://sheeq.app/get" />
<link rel="icon"             href="https://sheeq.app/icon.png" />

<style>
  :root{
    --bg:#0C0C0B; --bg2:#151412; --bg3:#1B1A17;
    --text:#F2F0F4; --muted:#A6A4A4; --warm:#ECE5D9;
    --bone:#C9C1B2; --line:rgba(242,240,244,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Arabic',sans-serif;
    background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%);
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:40px 20px;
  }
  .wrap{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}
  .icon{
    width:76px;height:76px;border-radius:18px;display:block;margin-bottom:16px;
    box-shadow:0 0 0 1px rgba(236,229,217,.14),0 14px 44px rgba(0,0,0,.5);
  }
  .mark{
    font-family:Cormorant,Georgia,'Times New Roman',serif;
    font-size:15px;letter-spacing:.34em;color:var(--warm);opacity:.75;
    text-transform:uppercase;margin-bottom:30px;
    /* letter-spacing pads the right side only — compensate physically so the
       wordmark is optically centred in both directions (as on /p). */
    transform:translateX(.17em);
  }
  h1{font-size:24px;font-weight:600;text-align:center;margin-bottom:8px;letter-spacing:.01em}
  .sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:30px;line-height:1.5}
  .cta{
    display:block;width:100%;text-align:center;text-decoration:none;
    background:var(--bone);color:#12110F;font-size:15px;font-weight:600;
    padding:15px 20px;border-radius:14px;margin-bottom:10px;
  }
  .hint{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.55;margin-top:6px}
  /* Desktop: the code is the action, the two stores are the alternative. A QR
     must stay dark-on-light to scan, so it sits on its own bone card. */
  .qr{
    width:168px;height:168px;background:var(--warm);border-radius:16px;
    padding:10px;margin-bottom:14px;
  }
  .qr svg{width:100%;height:100%;display:block;fill:#12110F}
  .desk-line{font-size:13px;color:var(--muted);text-align:center;line-height:1.5;margin-bottom:22px}
  .stores{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .store{
    display:block;text-align:center;text-decoration:none;color:var(--warm);
    font-size:13.5px;font-weight:600;padding:13px 10px;border-radius:14px;
    border:1px solid var(--line);background:rgba(242,240,244,.04);
  }
  .foot{margin-top:36px;font-size:11px;color:var(--muted);opacity:.6;letter-spacing:.06em}
  .foot a{color:inherit}
  [hidden]{display:none !important}
</style>
</head>

  <div class="mark">SHEEQ</div>

<script>
(function () {
  'use strict';

  // ── Where the tap came from ───────────────────────────────────────────────
  // `?src=tiktok` (snap, wa, …) is a free label handed to BOTH stores, so each
  // channel shows up in its own row: App Store Connect → App Analytics →
  // Campaigns (hidden until 5 installs through it — Apple's privacy floor), and
  // Play Console's acquisition report by UTM source (no floor). No label = "link".
  // Apple caps a campaign name at 30 characters; the whitelist keeps the value
  // safe to drop into both URLs.
  var qs = new URLSearchParams(location.search);
  var src = (qs.get('src') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 30) || 'link';

  // pt = the App Store Connect provider token: fixed for the account and public
  // by design (it rides in every campaign link). ct is the free label.
  var IOS_URL  = 'https://apps.apple.com/app/apple-store/id6762699699' +
                 '?pt=128806769&ct=' + src + '&mt=8';
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=app.sheeq&referrer=' +
                 encodeURIComponent('utm_source=' + src + '&utm_medium=link&utm_campaign=sheeq_get');

  // ── Copy ──────────────────────────────────────────────────────────────────
  // The door register: terse and gender-free by construction — no imperative
  // to the reader, no first-person adjective (the standing Arabic constraint on
  // every outward-facing string). Button labels are verbal nouns for the same
  // reason. Title + premise are the /p page's own words, verbatim.
  var COPY = {
    ar: {
      dir:'rtl', lang:'ar',
      title:'أي إطلالة؟',
      sub:'إطلالتين، والناس تختار',
      ios:'التحميل من App Store',
      android:'التحميل من Google Play',
      hint:'لم يُفتح المتجر؟ القائمة {m} ثم «الفتح في المتصفح».',
      desktop:'التطبيق للجوال — يكفي توجيه كاميرا الجوال إلى الرمز.'
    },
    en: {
      dir:'ltr', lang:'en',
      title:'Which look?',
      sub:'Two looks. People choose.',
      ios:'Download on the App Store',
      android:'Get it on Google Play',
      hint:'Store didn’t open? The {m} menu, then “Open in browser”.',
      desktop:'Sheeq is a phone app — point your phone’s camera at the code.'
    }
  };

  var forced = qs.get('l');
  var isAr = forced ? forced === 'ar'
                    : (navigator.language || 'en').toLowerCase().indexOf('ar') === 0;
  var C = isAr ? COPY.ar : COPY.en;
  document.documentElement.lang = C.lang;
  document.documentElement.dir  = C.dir;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS     = /iPhone|iPad|iPod/i.test(ua) ||
                  (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPadOS
  // The in-app browsers of the apps this link is posted in. They are where a
  // redirect to a store can be refused, so only they get the way-out hint.
  var inApp = /TikTok|musical_ly|Bytedance|Snapchat|Instagram|FBAN|FBAV|FB_IAB/i.test(ua);

  function $(id) { return document.getElementById(id); }
  $('title').textContent = C.title;
  $('sub').textContent   = C.sub;
  $('ios').href          = IOS_URL;
  $('android').href      = PLAY_URL;

  var target = isIOS ? IOS_URL : isAndroid ? PLAY_URL : null;

  if (!target) {
    // Desktop: nothing to install here — the code carries the visitor to a phone.
    $('qr').hidden = false;
    $('deskline').textContent = C.desktop;
    $('deskline').hidden = false;
    return;
  }

  // Phone: render the fallback FIRST, then leave. If the redirect is refused (an
  // in-app browser can), the visitor is left holding a working button, never a
  // blank page. A tap is a user gesture, which those browsers honour more often.
  $('desk').hidden = true;
  var cta = $('cta');
  cta.href = target;
  cta.textContent = isIOS ? C.ios : C.android;
  cta.hidden = false;
  if (inApp) {
    $('hint').textContent = C.hint.replace('{m}', isIOS ? '⋯' : '⋮');
    $('hint').hidden = false;
  }

  // replace(), not assign(): the store is not stacked on top of this page, so
  // Back does not land here and bounce straight to the store again.
  try { location.replace(target); } catch (_) { /* the button is already there */ }
})();
</script>
