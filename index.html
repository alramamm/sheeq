     bio or a video — so it must say what Sheeq is and lead to a store. Until

     links: a dead end. The two lines are the bio's, verbatim: the voter's line
     first, the asker's second (the same order the app teaches them in: the
     first card's frame line, then the turn line after the first vote).
     Unlike /get it does NOT jump to the store — a typed visit wants to read
     first. The legal pages stay linked at the foot (the stores' review reads
     them; /privacy and /terms are their own pages). -->

<style>
  :root{
    --bg:#0C0C0B; --bg2:#151412; --bg3:#1B1A17;
    --text:#F2F0F4; --muted:#A6A4A4; --warm:#ECE5D9;
    --bone:#C9C1B2; --line:rgba(242,240,244,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Arabic',sans-serif;
    background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%);
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:48px 20px 28px;
  }
  .wrap{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center}
  .icon{
    width:84px;height:84px;border-radius:20px;display:block;margin-bottom:16px;
    box-shadow:0 0 0 1px rgba(236,229,217,.14),0 14px 44px rgba(0,0,0,.5);
  }
  .mark{
    font-family:Cormorant,Georgia,'Times New Roman',serif;
    font-size:15px;letter-spacing:.34em;color:var(--warm);opacity:.75;
    text-transform:uppercase;margin-bottom:34px;
    /* letter-spacing pads the right side only — compensate physically so the
       wordmark is optically centred in both directions (as on /p and /get). */
    transform:translateX(.17em);
  }
  h1{font-size:24px;font-weight:600;text-align:center;line-height:1.4;margin-bottom:10px;letter-spacing:.01em;text-wrap:balance}
  .sub{font-size:15px;color:var(--muted);text-align:center;margin-bottom:34px;line-height:1.5}
  .cta{
    display:block;width:100%;text-align:center;text-decoration:none;
    background:var(--bone);color:#12110F;font-size:15px;font-weight:600;
    padding:15px 20px;border-radius:14px;
  }
  .qr{
    width:168px;height:168px;background:var(--warm);border-radius:16px;
    padding:10px;margin-bottom:14px;
  }
  .qr svg{width:100%;height:100%;display:block;fill:#12110F}
  .desk-line{font-size:13px;color:var(--muted);text-align:center;line-height:1.5;margin-bottom:22px}
  .stores{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .store{
    display:block;text-align:center;text-decoration:none;color:var(--warm);
    font-size:13.5px;font-weight:600;padding:13px 10px;border-radius:14px;
    border:1px solid var(--line);background:rgba(242,240,244,.04);
  }
  .foot{
    margin-top:44px;font-size:12px;color:var(--muted);text-align:center;line-height:2;
  }
  .foot a{color:var(--muted);text-decoration:none;opacity:.8}
  .foot .sep{opacity:.4;margin:0 8px}
  [hidden]{display:none !important}
</style>

<script>
(function () {
  'use strict';

  // ── Where the visit came from ─────────────────────────────────────────────
  // Same scheme as /get: `?src=` is a free label handed to BOTH stores (App
  // Store Connect campaigns — shown after 5 installs — and Play's UTM source).
  // No label = "home": a typed visit to the bare address.
  var qs = new URLSearchParams(location.search);
  var src = (qs.get('src') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 30) || 'home';

  var IOS_URL  = 'https://apps.apple.com/app/apple-store/id6762699699' +
                 '?pt=128806769&ct=' + src + '&mt=8';
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=app.sheeq&referrer=' +
                 encodeURIComponent('utm_source=' + src + '&utm_medium=link&utm_campaign=sheeq_home');

  // ── Copy ──────────────────────────────────────────────────────────────────
  // The bio, verbatim (2026-10-07). Gender-free by construction — «عندك»،
  // «رأيك»، «احترت»، «لك» are spelled the same for a man and a woman — and no
  // Arabic line ends in punctuation it does not need. Store labels and the
  // desktop line are /get's own.
  var COPY = {
    ar: {
      dir:'rtl', lang:'ar',
      title:'عندك ذوق؟ إطلالتين تنتظر رأيك',
      sub:'وإذا احترت، الناس تختار لك',
      ios:'التحميل من App Store',
      android:'التحميل من Google Play',
      desktop:'التطبيق للجوال — يكفي توجيه كاميرا الجوال إلى الرمز.',
      privacy:'الخصوصية', terms:'الشروط', safety:'سلامة الأطفال'
    },
    en: {
      dir:'ltr', lang:'en',
      title:'Got taste? Two looks await your call',
      sub:'Can’t decide? People choose for you',
      ios:'Download on the App Store',
      android:'Get it on Google Play',
      desktop:'Sheeq is a phone app — point your phone’s camera at the code.',
      privacy:'Privacy', terms:'Terms', safety:'Child safety'
    }
  };

  var forced = qs.get('l');
  var isAr = forced ? forced === 'ar'
                    : (navigator.language || 'en').toLowerCase().indexOf('ar') === 0;
  var C = isAr ? COPY.ar : COPY.en;
  document.documentElement.lang = C.lang;
  document.documentElement.dir  = C.dir;

  function $(id) { return document.getElementById(id); }
  $('title').textContent   = C.title;
  $('sub').textContent     = C.sub;
  $('privacy').textContent = C.privacy;
  $('terms').textContent   = C.terms;
  $('safety').textContent  = C.safety;
  $('ios').href            = IOS_URL;
  $('android').href        = PLAY_URL;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS     = /iPhone|iPad|iPod/i.test(ua) ||
                  (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPadOS
  var target = isIOS ? IOS_URL : isAndroid ? PLAY_URL : null;

  if (!target) {
    // Desktop: nothing to install here — the code carries the visitor to a phone.
    $('qr').hidden = false;
    $('deskline').textContent = C.desktop;
    $('deskline').hidden = false;
    return;
  }

  // Phone: this phone's store, one button. No automatic jump — that is /get's
  // job; a typed visit came to read what Sheeq is.
  $('desk').hidden = true;
  var cta = $('cta');
  cta.href = target;
  cta.textContent = isIOS ? C.ios : C.android;
  cta.hidden = false;
})();
</script>
