<title>Sheeq — ثيمة الأسبوع / This week’s theme</title>
<meta name="description" content="One theme, a thousand ways to wear it. Get Sheeq on the App Store or Google Play." />

<!-- This week's theme, for a visitor WITHOUT the app (growth P7, 9c — 2026-10-05).
     A phone WITH the app never loads this page: Android 1.0.2+ claims the exact
     paths /theme and /theme/ (intent filter) and iOS does the same through the
     AASA beside it, so the OS hands the link to the app, which opens the theme's
     own page (app/theme.tsx). Everyone else sees the theme in the app's words and
     one button to this phone's store.
     Served as /theme from theme.html — NOT /theme/ — so the link answers 200 with
     no trailing-slash redirect hop and `?src=` survives (theme/index.html forwards
     a pasted /theme/). Unlike /get there is no automatic redirect: the theme IS
     the pitch, and the visitor came for it. -->
<meta property="og:type"        content="website" />
<meta property="og:site_name"   content="Sheeq" />
<meta property="og:url"         content="https://sheeq.app/theme" />
<meta property="og:title"       content="Sheeq — ثيمة الأسبوع · This week’s theme" />
<meta property="og:description" content="ثيمة واحدة، وألف طريقة لارتدائها · One theme, a thousand ways to wear it." />
<meta property="og:image"       content="https://sheeq.app/og.png" />

<style>
  :root{
    --bg:#0C0C0B; --bg2:#151412; --bg3:#1B1A17;
    --text:#F2F0F4; --muted:#A6A4A4; --warm:#ECE5D9;
    --bone:#C9C1B2; --line:rgba(242,240,244,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Arabic',sans-serif;
    background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%);
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:40px 20px;
  }
  .wrap{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}
  .icon{
    width:76px;height:76px;border-radius:18px;display:block;margin-bottom:16px;
    box-shadow:0 0 0 1px rgba(236,229,217,.14),0 14px 44px rgba(0,0,0,.5);
  }
  .mark{
    font-family:Cormorant,Georgia,'Times New Roman',serif;
    font-size:15px;letter-spacing:.34em;color:var(--warm);opacity:.75;
    text-transform:uppercase;margin-bottom:30px;
    /* letter-spacing pads the right side only — compensate physically so the
       wordmark is optically centred in both directions (as on /get and /p). */
    transform:translateX(.17em);
  }
  h1{font-size:24px;font-weight:600;text-align:center;margin-bottom:8px;letter-spacing:.01em}
  .sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:30px;line-height:1.5}
  /* The theme in the app's own order: kicker · title · line · day. The button
     below stays the one bright thing on the page. */
  .theme{width:100%;text-align:center;margin-bottom:30px}
  .theme-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  /* Letter-spacing breaks Arabic joins (the app's rtlLetterSpacing rule). */
  html[dir="rtl"] .theme-kicker{letter-spacing:0}
  .theme-title{color:var(--warm);line-height:1.35}
  .theme-line{font-size:14px;color:var(--muted);line-height:1.6;margin:4px 0 12px}
  .theme-when{font-size:12.5px;color:var(--muted)}
  .cta{
    display:block;width:100%;text-align:center;text-decoration:none;
    background:var(--bone);color:#12110F;font-size:15px;font-weight:600;
    padding:15px 20px;border-radius:14px;margin-bottom:10px;
  }
  .hint{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.55;margin-top:6px}
  /* Desktop: the code is the action, the two stores are the alternative. A QR
     must stay dark-on-light to scan, so it sits on its own bone card. */
  .qr{
    width:168px;height:168px;background:var(--warm);border-radius:16px;
    padding:10px;margin-bottom:14px;
  }
  .qr svg{width:100%;height:100%;display:block;fill:#12110F}
  .desk-line{font-size:13px;color:var(--muted);text-align:center;line-height:1.5;margin-bottom:22px}
  .stores{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .store{
    display:block;text-align:center;text-decoration:none;color:var(--warm);
    font-size:13.5px;font-weight:600;padding:13px 10px;border-radius:14px;
    border:1px solid var(--line);background:rgba(242,240,244,.04);
  }
  .foot{margin-top:36px;font-size:11px;color:var(--muted);opacity:.6;letter-spacing:.06em}
  .foot a{color:inherit}
  [hidden]{display:none !important}
</style>

<script>
(function () {
  'use strict';

  // ── Config ────────────────────────────────────────────────────────────────
  // The anon key is a PUBLIC key and already ships inside the app bundle and on
  // /p. This page only reads: the theme a visitor may see (the hashtags_read
  // policy lets anon see a started theme or one announced ahead, nothing else).
  var SUPABASE_URL = 'https://bhpzdqezxsmdruhpguqi.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJocHpkcWV6eHNtZHJ1aHBndXFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzODg5ODYsImV4cCI6MjA4ODk2NDk4Nn0.O7VAX3N9S7_kpBfxvJor26OgbQ7Kx3-uBYCdo-DvAUU';

  // ── Where the tap came from ───────────────────────────────────────────────
  // `?src=<label>` is handed to BOTH stores, exactly as on /get: App Store
  // Connect → Campaigns (hidden until 5 installs come through it) and Play
  // Console's acquisition report by UTM source. No label = "theme". Same
  // whitelist and 30-character cap (Apple's limit on a campaign name). The app
  // reads nothing from this URL's query, so the label is invisible to it.
  var qs = new URLSearchParams(location.search);
  var src = (qs.get('src') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 30) || 'theme';
  var IOS_URL  = 'https://apps.apple.com/app/apple-store/id6762699699' +
                 '?pt=128806769&ct=' + src + '&mt=8';
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=app.sheeq&referrer=' +
                 encodeURIComponent('utm_source=' + src + '&utm_medium=link&utm_campaign=sheeq_theme');

  // ── Copy ──────────────────────────────────────────────────────────────────
  // Nothing new: the theme lines are the app's own strings (i18n brief.*) as
  // /p carries them, and the premise, store buttons, hint and desktop line are
  // /get's, word for word. The door register: gender-free, no imperative to the
  // reader; button labels are verbal nouns.
  var COPY = {
    ar: {
      dir:'rtl', lang:'ar',
      title:'أي إطلالة؟',
      sub:'إطلالتين، والناس تختار',
      ios:'التحميل من App Store',
      android:'التحميل من Google Play',
      hint:'لم يُفتح المتجر؟ القائمة {m} ثم «الفتح في المتصفح».',
      desktop:'التطبيق للجوال — يكفي توجيه كاميرا الجوال إلى الرمز.',
      theme_kicker:'ثيمة الأسبوع',
      theme_next_kicker:'قادمة',
      closes_today:'تُغلق المشاركات اليوم',
      closes_today_at:'تُغلق المشاركات اليوم {time}',
      closes_tomorrow_at:'تُغلق المشاركات غداً {time}',
      closes_on:'تُغلق المشاركات {when}',
      starts_today:'تبدأ اليوم',
      starts_today_at:'تبدأ اليوم {time}',
      starts_tomorrow_at:'تبدأ غداً {time}',
      starts_on:'تبدأ {when}',
      period_am:'صباحاً',
      period_pm:'مساءً'
    },
    en: {
      dir:'ltr', lang:'en',
      title:'Which look?',
      sub:'Two looks. People choose.',
      ios:'Download on the App Store',
      android:'Get it on Google Play',
      hint:'Store didn’t open? The {m} menu, then “Open in browser”.',
      desktop:'Sheeq is a phone app — point your phone’s camera at the code.',
      theme_kicker:'This week’s theme',
      theme_next_kicker:'Coming',
      closes_today:'Entries close today',
      closes_today_at:'Entries close today, {time}',
      closes_tomorrow_at:'Entries close tomorrow, {time}',
      closes_on:'Entries close {when}',
      starts_today:'Starts today',
      starts_today_at:'Starts today, {time}',
      starts_tomorrow_at:'Starts tomorrow, {time}',
      starts_on:'Starts {when}',
      period_am:'am',
      period_pm:'pm'
    }
  };

  var forced = qs.get('l');
  var isAr = forced ? forced === 'ar'
                    : (navigator.language || 'en').toLowerCase().indexOf('ar') === 0;
  var C = isAr ? COPY.ar : COPY.en;
  document.documentElement.lang = C.lang;
  document.documentElement.dir  = C.dir;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS     = /iPhone|iPad|iPod/i.test(ua) ||
                  (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPadOS
  // The in-app browsers this link is posted in: a store link can be refused
  // there, so only they get the way-out hint.
  var inApp = /TikTok|musical_ly|Bytedance|Snapchat|Instagram|FBAN|FBAV|FB_IAB/i.test(ua);

  function $(id) { return document.getElementById(id); }
  $('title').textContent = C.title;
  $('sub').textContent   = C.sub;
  $('ios').href          = IOS_URL;
  $('android').href      = PLAY_URL;

  // The premise waits for the theme read, so a live theme never flashes the
  // premise first. It returns if the read fails, finds nothing, or is slow.
  $('premise').hidden = true;

  var target = isIOS ? IOS_URL : isAndroid ? PLAY_URL : null;
  if (target) {
    // Phone: one button for this phone's store. A tap is a user gesture, which
    // in-app browsers honour more often than a scripted redirect.
    $('desk').hidden = true;
    var cta = $('cta');
    cta.href = target;
    cta.textContent = isIOS ? C.ios : C.android;
    cta.hidden = false;
    if (inApp) {
      $('hint').textContent = C.hint.replace('{m}', isIOS ? '⋯' : '⋮');
      $('hint').hidden = false;
    }
  } else {
    // Desktop: nothing to install here — the code carries the visitor to a phone.
    $('qr').hidden = false;
    $('deskline').textContent = C.desktop;
    $('deskline').hidden = false;
  }

  // ── A minimal PostgREST client in the supabase-js chain shape ─────────────
  // Same shape as /p's ON PURPOSE: this page is another client of the database,
  // deployed from another repo, and the repo's offline guards
  // (check-column-surface, check-rpc-surface) read exactly that shape — a column
  // renamed by a migration fails `npm run verify` instead of silently emptying
  // the live page. ⚠️ Those guards cannot tell prose from code — never spell a
  // table literal inside a comment here.
  var HEADERS = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, Accept: 'application/json' };
  var api = {
    from: function (table) {
      var cols = '*', filters = [], order = null, lim = null;
      var q = {
        select: function (c) { cols = c; return q; },
        eq:  function (col, val) { filters.push(col + '=eq.'  + encodeURIComponent(val)); return q; },
        lte: function (col, val) { filters.push(col + '=lte.' + encodeURIComponent(val)); return q; },
        gt:  function (col, val) { filters.push(col + '=gt.'  + encodeURIComponent(val)); return q; },
        // supabase-js semantics: ascending unless told otherwise.
        order: function (col, opts) {
          order = col + '.' + (opts && opts.ascending === false ? 'desc' : 'asc');
          return q;
        },
        limit: function (n) { lim = n; return q; },
        maybeSingle: function () {
          var url = SUPABASE_URL + '/rest/v1/' + table + '?select=' + cols +
                    (filters.length ? '&' + filters.join('&') : '') +
                    (order ? '&order=' + order : '') +
                    (lim ? '&limit=' + lim : '');
          return fetch(url, { headers: HEADERS })
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (rows) { return (rows && rows[0]) || null; });
        }
      };
      return q;
    }
  };

  // ── The theme ─────────────────────────────────────────────────────────────
  // Live means what the server means (f_live_brief_tags): switched on, started,
  // not yet ended. With nothing live, the nearest theme the house announced
  // ahead, as «قادمة» / "Coming" — never both, as in the app. ⚠️ "now" is the
  // visitor's clock, so a phone set days off can show a theme a little early or
  // late; the server refuses an entry outside the window anyway.
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

  // The app's dayPhrase (src/utils/brief.ts), rule for rule, as on /p: calendar
  // days on this device; today / tomorrow; a weekday while it is unambiguous
  // (within six days), a date after that. A replacer function, never a string.
  // Today and tomorrow carry the hour (2026-10-07, as in the app): in this
  // device's clock and digits, minutes only when there are any. A moment already
  // behind us (a stale read) keeps the plain "today".
  function clock(at) {
    var loc = isAr ? 'ar' : 'en-US';
    var h = at.getHours(), m = at.getMinutes();
    var hour = new Intl.NumberFormat(loc).format(h % 12 === 0 ? 12 : h % 12);
    var time = m === 0 ? hour : hour + ':' + new Intl.NumberFormat(loc, { minimumIntegerDigits: 2 }).format(m);
    return time + ' ' + (h < 12 ? C.period_am : C.period_pm);
  }
  function dayPhrase(iso, verb) {
    var at = new Date(iso);
    var now = new Date();
    var days = Math.round((startOfDay(at) - startOfDay(now)) / 86400000);
    if (!isFinite(days)) return C[verb + '_today'];
    if (days <= 0) {
      if (at.getTime() <= now.getTime()) return C[verb + '_today'];
      return C[verb + '_today_at'].replace('{time}', function () { return clock(at); });
    }
    if (days === 1) return C[verb + '_tomorrow_at'].replace('{time}', function () { return clock(at); });
    var when = at.toLocaleDateString(isAr ? 'ar' : 'en-US',
      days <= 6 ? { weekday: 'long' } : { day: 'numeric', month: 'long' });
    return C[verb + '_on'].replace('{when}', function () { return when; });
  }

  // House text is typed into the app's panel, which can carry invisible
  // direction marks (a right-to-left mark at the start of an English line flips
  // its punctuation). Stripped here as well as fixed at the source.
  function clean(s) {
    return String(s || '').replace(/[‎‏‪-‮⁦-⁩؜﻿]/g, '').trim();
  }
  // The reader's language first, the other if it is somehow blank (briefLabel).
  function pick(row, field) {
    var first  = clean(isAr ? row[field + '_ar'] : row[field + '_en']);
    return first || clean(isAr ? row[field + '_en'] : row[field + '_ar']);
  }

  var settled = false;
  function showPremise() {
    if (settled) return;
    settled = true;
    $('premise').hidden = false;
  }
  function showTheme(row, live) {
    if (settled) return;
    var label = pick(row, 'label');
    if (!label) { showPremise(); return; }
    settled = true;
    $('kicker').textContent = live ? C.theme_kicker : C.theme_next_kicker;
    $('ttitle').textContent = label;
    var line = pick(row, 'description');
    if (line) { $('tline').textContent = line; $('tline').hidden = false; }
    $('twhen').textContent = live ? dayPhrase(row.ends_at, 'closes') : dayPhrase(row.starts_at, 'starts');
    $('theme').hidden = false;
  }

  // A slow network must not leave the page without a headline.
  setTimeout(showPremise, 4000);

  var now = new Date().toISOString();
  api.from('hashtags')
    .select('label_ar,label_en,description_ar,description_en,starts_at,ends_at')
    .eq('is_active', true)
    .lte('starts_at', now)
    .gt('ends_at', now)
    .order('starts_at', { ascending: false })
    .limit(1)
    .maybeSingle()
    .then(function (live) {
      if (live) { showTheme(live, true); return; }
      return api.from('hashtags')
        .select('label_ar,label_en,description_ar,description_en,starts_at,ends_at')
        .eq('is_active', true)
        .eq('announce_ahead', true)
        .gt('starts_at', now)
        .order('starts_at', { ascending: true })
        .limit(1)
        .maybeSingle()
        .then(function (next) { if (next) showTheme(next, false); else showPremise(); });
    })
    .catch(showPremise);
})();
</script>
</body>
</html>
